<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>SKU Lookup</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>📱 Apple SKU Lookup</h1>

        <p>Search by model, colour, storage or SKU</p>

    </header>

    <div class="container">

        <input id="search" type="text" placeholder="Search anything...">

        <table id="skuTable">

            <thead>

                <tr>

                    <th>Model</th>
                    <th>Colour</th>
                    <th>Storage</th>
                    <th>SKU</th>

                </tr>

            </thead>

            <tbody>

                <tr>
                    <td>iPhone 18 Pro Max</td>
                    <td>Black</td>
                    <td>256GB</td>
                    <td>MJXN4AF/A</td>
                </tr>

                <tr>
                    <td>iPhone 18 Pro Max</td>
                    <td>Burgundy</td>
                    <td>2TB</td>
                    <td>MJY44AF/A</td>
                </tr>

                <tr>
                    <td>iPhone 17 Pro</td>
                    <td>Silver</td>
                    <td>512GB</td>
                    <td>MG8K4AF/A</td>
                </tr>

                <tr>
                    <td>iPhone Air</td>
                    <td>Cloud White</td>
                    <td>1TB</td>
                    <td>MG2X4AF/A</td>
                </tr>

                <!-- continue adding every SKU -->

            </tbody>

        </table>

    </div>

    <script src="js/sku.js"></script>

</body>

</html>
