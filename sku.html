<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apple SKU Lookup</title>

    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sku.css">

    <style>
        .search-box {

            margin: 30px 0;

            display: flex;

            gap: 15px;

            flex-wrap: wrap;

        }

        .search-box input,
        .search-box select {

            padding: 15px;

            border: none;

            border-radius: 15px;

            font-size: 16px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);

        }

        .search-box input {

            flex: 1;

            min-width: 300px;

        }

        .search-box select {

            min-width: 180px;

        }

        .stats {

            margin-bottom: 20px;

            font-weight: 600;

            color: #666;

        }

        #products {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

            gap: 20px;

        }

        .phone {

            background: white;

            padding: 20px;

            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);

            transition: .3s;

            cursor: pointer;

        }

        .phone:hover {

            transform: translateY(-5px);

        }

        .phone h3 {

            margin-bottom: 12px;

            color: #0071e3;

        }

        .phone p {

            margin: 6px 0;

        }

        .phone .sku {

            font-size: 18px;

            font-weight: bold;

            color: #111;

            margin-top: 15px;

        }

        .copy {

            margin-top: 15px;

            background: #0071e3;

            color: white;

            border: none;

            padding: 10px 20px;

            border-radius: 12px;

            cursor: pointer;

            width: 100%;

        }

        .copy:hover {

            background: #0058b3;

        }

        .back {

            display: inline-block;

            margin-top: 20px;

            text-decoration: none;

            font-weight: bold;

            color: #0071e3;

        }
    </style>

</head>

<body>

    <header>

        <h1>🍎 Apple SKU Lookup</h1>

        <p>Search any Apple product instantly</p>

        <a href="index.html" class="back">← Back to Home</a>

    </header>

    <div class="container">

        <div class="search-box">

            <input id="search" type="text" placeholder="Search model, colour, storage or SKU...">

            <select id="modelFilter">

                <option value="">All Models</option>

            </select>

            <select id="storageFilter">

                <option value="">All Storage</option>

            </select>

        </div>

        <div class="stats">

            <span id="count"></span>

        </div>

        <div id="products">

        </div>

    </div>

    <script src="js/sku-data.js"></script>

    <script src="js/sku.js"></script>

</body>

</html>
